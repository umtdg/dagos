[default_config]
version = "0.10.1"
assembler = "gas"
instruction_set = "arm64"

[default_config.opts]
compiler = "zig"
compile_flags_txt = [
    "cc",
    "-x", "assembler-with-cpp",
    "-target", "aarch64-freestanding",
    "-mcpu=generic",
    "-c",
    "-o", "-",
]
diagnostics = true
default_diagnostics = false
